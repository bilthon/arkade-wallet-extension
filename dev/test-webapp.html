<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkade Wallet — test dapp</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
        color: #1a1d21;
      }
      h1 { font-size: 20px; }
      .status { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
      .status.ok { color: #16a34a; }
      .status.no { color: #c2410c; }
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      button {
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #f6f7f9;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover { border-color: #2f6df6; }
      pre {
        background: #16181c;
        color: #e8eaed;
        padding: 12px;
        border-radius: 8px;
        font-size: 12px;
        max-height: 380px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Arkade Wallet — test dapp</h1>
    <p class="status" id="status">Checking for window.arkadeWallet…</p>

    <div class="buttons">
      <button data-call="connect">connect()</button>
      <button data-call="isConnected">isConnected()</button>
      <button data-call="getAccounts">getAccounts()</button>
      <button data-call="getAddress">getAddress()</button>
      <button data-call="getBoardingAddress">getBoardingAddress()</button>
      <button data-call="getPublicKey">getPublicKey()</button>
      <button data-call="getBalance">getBalance()</button>
      <button data-call="getNetwork">getNetwork()</button>
      <button id="signMessage">signMessage()</button>
      <button id="signPsbt">signPsbt(psbt, idx)</button>
      <button id="coSignTest">Test signPsbt co-sign</button>
      <button data-call="disconnect">disconnect()</button>
      <button id="clear">clear log</button>
    </div>

    <div class="buttons">
      <input id="msg" placeholder="message to sign" value="Sign in to test web app" style="flex:1;min-width:200px;padding:8px;border:1px solid #d1d5db;border-radius:8px;" />
    </div>
    <div class="buttons">
      <input id="psbt" placeholder="base64/hex PSBT" style="flex:1;min-width:200px;padding:8px;border:1px solid #d1d5db;border-radius:8px;" />
      <input id="idx" placeholder="input indexes (e.g. 0,1)" value="0" style="width:160px;padding:8px;border:1px solid #d1d5db;border-radius:8px;" />
    </div>

    <pre id="log"></pre>

    <script>
      const logEl = document.getElementById('log');
      const statusEl = document.getElementById('status');

      function log(label, value) {
        const time = new Date().toLocaleTimeString();
        const body = value instanceof Error
          ? `${value.name}: ${value.message}` + (value.code ? `  [code=${value.code}]` : '')
          : JSON.stringify(value, null, 2);
        logEl.textContent = `[${time}] ${label}\n${body}\n\n` + logEl.textContent;
      }
      // Expose the logger so the ES-module harness (dev/harness.ts) can write here too.
      window.appLog = log;

      // The provider injects at document_start, but be defensive on slow loads.
      function ready() {
        const w = window.arkadeWallet;
        if (w) {
          statusEl.textContent = 'window.arkadeWallet detected ✓';
          statusEl.className = 'status ok';
          // Subscribe to provider events to prove they reach the page.
          ['accountsChanged', 'networkChanged', 'disconnect'].forEach((ev) =>
            w.on(ev, (data) => log(`event: ${ev}`, data ?? null)),
          );
        } else {
          statusEl.textContent =
            'window.arkadeWallet NOT found — is the extension loaded on this origin?';
          statusEl.className = 'status no';
        }
      }
      if (window.arkadeWallet) ready();
      else window.addEventListener('load', ready);

      document.querySelectorAll('button[data-call]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const method = btn.dataset.call;
          const w = window.arkadeWallet;
          if (!w) return log(method, new Error('window.arkadeWallet is undefined'));
          try {
            const result = await w[method]();
            log(`${method}() →`, result ?? null);
          } catch (err) {
            log(`${method}() threw`, err);
          }
        });
      });

      // signMessage: BIP322 over the text in the message box (re-prompts every call).
      document.getElementById('signMessage').addEventListener('click', async () => {
        const w = window.arkadeWallet;
        if (!w) return log('signMessage', new Error('window.arkadeWallet is undefined'));
        const message = document.getElementById('msg').value;
        try {
          const sig = await w.signMessage({ message });
          log('signMessage() →', sig);
        } catch (err) {
          log('signMessage() threw', err);
        }
      });

      // signPsbt: partial-sign the given inputs, returns the UNFINALIZED PSBT (base64).
      // Paste an escrow/own-coin PSBT and the input indexes to sign.
      document.getElementById('signPsbt').addEventListener('click', async () => {
        const w = window.arkadeWallet;
        if (!w) return log('signPsbt', new Error('window.arkadeWallet is undefined'));
        const psbt = document.getElementById('psbt').value.trim();
        const inputIndexes = document
          .getElementById('idx')
          .value.split(',')
          .map((s) => parseInt(s.trim(), 10))
          .filter((n) => Number.isInteger(n));
        try {
          const signed = await w.signPsbt({ psbt, inputIndexes });
          log('signPsbt() → (unfinalized)', signed);
        } catch (err) {
          log('signPsbt() threw', err);
        }
      });

      document.getElementById('clear').addEventListener('click', () => {
        logEl.textContent = '';
      });
    </script>

    <!-- ES module: needs the SDK, so it only works when served by Vite (npm run test:webapp),
         not python http.server. Builds an escrow + spend PSBT and exercises signPsbt live. -->
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
